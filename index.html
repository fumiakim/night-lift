document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ace;font-size:14px;color:#8d8aa6;\">FINAL SCORE&nbsp; <span style=\"color:#e9e7f2;\">{{ score }}<\/span><\/div>\n          <button sc-camel-on-click=\"{{ restart }}\" style=\"margin-top:6px;font-family:'Chakra Petch',sans-serif;font-size:16px;font-weight:700;letter-spacing:.05em;color:#0a0810;background:#ff5a6e;border:none;padding:13px 34px;border-radius:10px;cursor:pointer;box-shadow:0 0 30px -6px rgba(255,90,110,.7);\">\u3082\u3046\u4e00\u5ea6 &nbsp;\u25b8<\/button>\n        <\/div>\n      <\/sc-if>\n    <\/div>\n\n    <div style=\"font-family:'Space Mono',monospace;font-size:11px;color:#6c6986;display:flex;gap:20px;flex-wrap:wrap;justify-content:center;\">\n      <span><span style=\"color:#8d8aa6;\">\u2190\u2192<\/span> \u79fb\u52d5 / \u4e57\u964d<\/span>\n      <span><span style=\"color:#8d8aa6;\">\u2191<\/span> \u30b8\u30e3\u30f3\u30d7<\/span>\n      <span><span style=\"color:#8d8aa6;\">\u2193<\/span> \u3057\u3083\u304c\u3080<\/span>\n      <span><span style=\"color:#8d8aa6;\">SPACE<\/span> \u5c04\u6483<\/span>\n      <span><span style=\"color:#8d8aa6;\">ENTER<\/span> \u6c7a\u5b9a<\/span>\n      <span><span style=\"color:#8d8aa6;\">\u30d1\u30c3\u30c9<\/span> A \u5c04\u6483 / B \u30b8\u30e3\u30f3\u30d7<\/span>\n    <\/div>\n  <\/div>\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;difficulty&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Casual&quot;,&quot;Normal&quot;,&quot;Hard&quot;],&quot;default&quot;:&quot;Normal&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Game&quot;},&quot;gameSpeed&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.75,&quot;min&quot;:0.4,&quot;max&quot;:1.2,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Game&quot;},&quot;startStage&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1,&quot;min&quot;:1,&quot;max&quot;:9,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Game&quot;},&quot;music&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Audio&quot;},&quot;scanlines&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Visuals&quot;},&quot;playerColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#ffc23d&quot;,&quot;options&quot;:[&quot;#34e3ff&quot;,&quot;#9cf04d&quot;,&quot;#ffc23d&quot;,&quot;#ff4d9d&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Visuals&quot;}}\">\nclass Component extends DCLogic {\n  state = { mode:'title', stage:1, docs:0, totalDocs:0, lives:3, score:0, timeText:'90', bonusText:'+0' };\n  canvasRef = React.createRef();\n  keys = {};\n  frame = 0;\n\n  componentDidMount(){\n    // pixel-art enemy sprites (drawn nearest-neighbour, never interpolated)\n    this.sprites={};\n    for(const [key,src] of [\n      ['odd1','assets/enemy_odd_f1.png'],['odd2','assets/enemy_odd_f2.png'],\n      ['odd3','assets/enemy_odd_f3.png'],['odd4','assets/enemy_odd_f4.png'],\n      ['even1','assets/enemy_even_f1.png'],['even2','assets/enemy_even_f2.png']\n    ]){\n      const im=new Image(); im.src=src; this.sprites[key]=im;\n    }\n    this.W=960; this.H=600; this.FLOOR_H=132; this.WALL=44;\n    this.WALK=2.97; this.ELEV=2.64; this.PB=7.4; this.EBbase=5.8; this.CAGEH=90; this.JUMPV=8.6;\n    this.lives=3; this.score=0; this.stage=1;\n    this.ctx = this.canvasRef.current.getContext('2d');\n    // Gamepad API only enumerates pads while the document has focus \u2014 make the canvas focusable\n    // and claim focus on any pointer contact so a connected controller is seen.\n    const cv=this.canvasRef.current;\n    cv.setAttribute('tabindex','0');\n    cv.style.outline='none';\n    this.onPointer = ()=>{ try{ window.focus(); cv.focus({preventScroll:true}); }catch(e){} this.initAudio(); };\n    cv.addEventListener('pointerdown', this.onPointer);\n    window.addEventListener('pointerdown', this.onPointer);\n    this.onPadConnect = ()=>{ this.padOn=true; };\n    window.addEventListener('gamepadconnected', this.onPadConnect);\n    this.onKeyDown = (e)=>this.handleKeyDown(e);\n    this.onKeyUp = (e)=>this.handleKeyUp(e);\n    window.addEventListener('keydown', this.onKeyDown);\n    window.addEventListener('keyup', this.onKeyUp);\n    this.last = performance.now();\n    this.running = true;\n    this.loop = this.loop.bind(this);\n    requestAnimationFrame(this.loop);\n  }\n  componentWillUnmount(){\n    this.running=false;\n    window.removeEventListener('keydown', this.onKeyDown);\n    window.removeEventListener('keyup', this.onKeyUp);\n  }\n\n  diffMul(){ const d=this.props.difficulty||'Normal'; return d==='Casual'?0.78:d==='Hard'?1.32:1.0; }\n  timeMul(){ const d=this.props.difficulty||'Normal'; return d==='Casual'?1.3:d==='Hard'?0.82:1.0; }\n\n  feetY(f){ return f*this.FLOOR_H + this.FLOOR_H - 16; }\n  clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }\n\n  initAudio(){\n    if(this.actx!==undefined){ if(this.actx && this.actx.state==='suspended') this.actx.resume(); return; }\n    try{ this.actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ this.actx=null; }\n  }\n  sfx(type){\n    const a=this.actx; if(!a) return; if(a.state==='suspended'){ try{a.resume();}catch(e){} }\n    const t=a.currentTime;\n    const beep=(f1,f2,dur,wave,gain,when)=>{ const t0=t+(when||0); const o=a.createOscillator(), g=a.createGain();\n      o.type=wave||'square'; o.frequency.setValueAtTime(f1,t0); if(f2) o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t0+dur);\n      g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(gain||0.16,t0+0.008); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);\n      o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0+dur+0.03); };\n    const noise=(dur,gain,filt)=>{ const n=a.createBufferSource(), buf=a.createBuffer(1,Math.max(1,Math.floor(a.sampleRate*dur)),a.sampleRate), d=buf.getChannelData(0);\n      for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; n.buffer=buf;\n      const fl=a.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=filt||1000;\n      const g=a.createGain(); g.gain.setValueAtTime(gain||0.18,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);\n      n.connect(fl); fl.connect(g); g.connect(a.destination); n.start(t); n.stop(t+dur+0.03); };\n    if(type==='shoot'){ beep(880,160,0.12,'square',0.10); }\n    else if(type==='jump'){ beep(300,620,0.14,'sine',0.13); }\n    else if(type==='land'){ noise(0.08,0.16,650); beep(150,80,0.1,'sine',0.09); }\n    else if(type==='pickup'){ beep(680,1000,0.09,'triangle',0.12,0); beep(1000,1360,0.11,'triangle',0.12,0.06); }\n    else if(type==='hurt'){ beep(280,60,0.32,'sawtooth',0.16); }\n    else if(type==='explode'){ noise(0.6,0.42,1100); noise(0.34,0.3,4600); beep(150,32,0.65,'sawtooth',0.32); beep(66,26,0.9,'sine',0.28); beep(320,70,0.42,'square',0.14,0.02); }\n  }\n\n  scheduleBGM(){\n    const a=this.actx; if(!a) return;\n    const play = this.state.mode==='playing' && this.props.music!==false;\n    if(!this.bgmGain){ this.bgmGain=a.createGain(); this.bgmGain.gain.value=0.0001; this.bgmGain.connect(a.destination); }\n    if(!play){ try{ this.bgmGain.gain.setTargetAtTime(0.0001, a.currentTime, 0.25); }catch(e){} this.bgmNext=0; return; }\n    this.bgmGain.gain.setTargetAtTime(0.34, a.currentTime, 0.6);\n    const dur=15/this.musicCfg().bpm; // 16th note at this stage's tempo (60/bpm/4)\n    if(!this.bgmNext){ this.bgmNext=a.currentTime+0.06; this.bgmStep=0; }\n    while(this.bgmNext < a.currentTime+0.2){\n      this.bgmNote(this.bgmStep, this.bgmNext, dur);\n      this.bgmStep=(this.bgmStep+1)%32; this.bgmNext+=dur;\n    }\n  }\n  musicCfg(){\n    // one BGM per stage (loops after 5): tempo, key, riff and timbre all change\n    // all five stages are ARRANGEMENTS of the original NOIR loop: same A-minor bass walk,\n    // same square arpeggio and sawtooth pad \u2014 only tempo, key, register and layering shift.\n    const bass=[0,0,7,3, 5,3,7,10];\n    const arp =[12,null,19,null, 15,null,22,19, 12,null,17,null, 15,22,17,null];\n    const M=[\n      // 1 \u2014 the original, untouched\n      {name:'NOIR',        bpm:100, root:0,  bass:bass, bw:'triangle', arp:arp, aw:'square', av:0.07,  pad:[0,7],   pw:'sawtooth', hat:'off16', kick:'none'},\n      // 2 \u2014 same loop, a touch slower and warmer: bass drops out on the off-quarters, soft kick\n      {name:'NOIR / DUSK', bpm:94,  root:-2, bass:[0,null,7,3, 5,null,7,10], bw:'triangle', arp:arp, aw:'square', av:0.065, pad:[0,3,7], pw:'sawtooth', hat:'off16', kick:'soft'},\n      // 3 \u2014 half-lit: sparse arpeggio, wide pad, no hat\n      {name:'NOIR / DEEP', bpm:86,  root:-5, bass:[0,null,null,7, 5,null,null,10], bw:'sine', arp:[12,null,null,null, 15,null,22,null, 12,null,null,null, 15,null,17,null], aw:'square', av:0.075, pad:[0,7,12], pw:'sawtooth', hat:'none', kick:'none'},\n      // 4 \u2014 tighter and edgier: same figure driven on straight 16ths\n      {name:'NOIR / WIRE', bpm:108, root:1,  bass:bass, bw:'triangle', arp:[12,12,19,null, 15,15,22,19, 12,12,17,null, 15,22,17,17], aw:'square', av:0.055, pad:[0,7], pw:'sawtooth', hat:'on16', kick:'tick'},\n      // 5 \u2014 the loop at full pressure: octave-up lead, four-on-the-floor\n      {name:'NOIR / BURN', bpm:116, root:0,  bass:[0,0,7,3, 5,3,10,10], bw:'square', arp:[24,null,19,null, 27,null,22,19, 24,null,17,null, 27,22,17,null], aw:'square', av:0.05, pad:[0,7], pw:'sawtooth', hat:'on8', kick:'four'}\n    ];\n    return M[(Math.max(1,this.stage||1)-1) % M.length];\n  }\n  bgmNote(step, t, dur){\n    const a=this.actx, g0=this.bgmGain, cfg=this.musicCfg();\n    const A1=55, semi=(n)=>A1*Math.pow(2,(n+cfg.root)/12);\n    const tone=(freq,len,type,vol,glide)=>{ const o=a.createOscillator(), g=a.createGain();\n      o.type=type; o.frequency.setValueAtTime(freq,t); if(glide) o.frequency.exponentialRampToValueAtTime(glide,t+len);\n      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t+len);\n      o.connect(g); g.connect(g0); o.start(t); o.stop(t+len+0.03); };\n    const click=(freq,vol,len)=>{ const o=a.createOscillator(), g=a.createGain(); o.type='square'; o.frequency.value=freq;\n      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.005); g.gain.exponentialRampToValueAtTime(0.0001,t+len);\n      o.connect(g); g.connect(g0); o.start(t); o.stop(t+len+0.02); };\n    const hitNoise=(vol,len,hz)=>{ const n=a.createBufferSource(), sr=a.sampleRate, b=a.createBuffer(1,sr*len,sr), d=b.getChannelData(0);\n      for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length); n.buffer=b;\n      const fl=a.createBiquadFilter(); fl.type='bandpass'; fl.frequency.value=hz; const g=a.createGain();\n      g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+len);\n      n.connect(fl); fl.connect(g); g.connect(g0); n.start(t); n.stop(t+len+0.02); };\n\n    // bass \u2014 one note per quarter across 2 bars\n    if(step%4===0){ const q=(step>>2)%8, bn=cfg.bass[q];\n      if(bn!==null && bn!==undefined) tone(semi(bn+12), dur*3.4, cfg.bw, 0.42, semi(bn+12)*0.5);\n    }\n    // melodic arpeggio on 16ths\n    const an=cfg.arp[step%16];\n    if(an!==null && an!==undefined) tone(semi(an+24), dur*0.92, cfg.aw, cfg.av);\n    // pad swell at each bar\n    if(cfg.pad && step%16===0) cfg.pad.forEach((iv,ix)=>tone(semi(iv+24), dur*15, cfg.pw, 0.034-ix*0.006));\n    // percussion\n    if(cfg.hat==='off16' && step%2===1) click(8000,0.02,0.04);\n    else if(cfg.hat==='on16') click(9000,0.014,0.03);\n    else if(cfg.hat==='on8' && step%2===0) click(7600,0.024,0.045);\n    else if(cfg.hat==='snare' && step%8===4) hitNoise(0.10,0.13,1900);\n    if(cfg.kick==='four' && step%4===0) tone(96,0.14,'sine',0.5,42);\n    else if(cfg.kick==='soft' && step%8===0) tone(80,0.2,'sine',0.34,40);\n    else if(cfg.kick==='tick' && step%8===0) tone(110,0.1,'triangle',0.3,52);\n  }\n\n  handleKeyDown(e){\n    const c=e.code;\n    this.initAudio();\n    if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(c)) e.preventDefault();\n    this.keys[c]=true;\n    if(this.state.mode!=='playing'){\n      if(e.key==='Enter' || c==='Space'){\n        if(this.state.mode==='title') this.startGame();\n        else if(this.state.mode==='cleared') this.continueStage();\n        else if(this.state.mode==='gameover') this.startGame();\n      }\n    }\n  }\n  handleKeyUp(e){ this.keys[e.code]=false; }\n\n  // --- Bluetooth / USB gamepad support (Web Gamepad API) ---\n  pollGamepad(){\n    if(!navigator.getGamepads) return;\n    if(!document.hasFocus()) this.padBlur=true; else this.padBlur=false;\n    let gp=null;\n    for(const g of navigator.getGamepads()){ if(g && g.connected){ gp=g; break; } }\n    this.padOn = !!gp;\n    if(!gp){ this.padPrev=null; return; }\n    const ax=gp.axes||[], bt=gp.buttons||[], DZ=0.35;\n    const held=(i)=>!!(bt[i] && (bt[i].pressed || bt[i].value>0.5));\n    const lx=ax[0]||0, ly=ax[1]||0;\n    const st={\n      ArrowLeft:  lx<-DZ || held(14),\n      ArrowRight: lx> DZ || held(15),\n      ArrowUp:    ly<-DZ || held(12) || held(1) || held(4) || held(6),   // \u5341\u5b57\u4e0a / B / L1 / L2 \u2014 \u30b8\u30e3\u30f3\u30d7\n      ArrowDown:  ly> DZ || held(13),\n      Space:      held(0) || held(5) || held(7)                          // A / R1 / R2 \u2014 \u5c04\u6483\n    };\n    // gamepad state merges with the keyboard: a key held stays held\n    const prev=this.padPrev||{};\n    for(const k in st){\n      if(st[k]) this.keys[k]=true;\n      else if(prev[k]) this.keys[k]=false;   // only release what the pad itself pressed\n    }\n    // menu confirm on rising edge of A / Start\n    const confirm = held(0) || held(9);\n    if(confirm && !this.padConfirm && this.state.mode!=='playi }, sk, {frames:['odd1','odd2','odd3','odd4'], drawH:40})\n      : Object.assign({}, sk, {frames:['even1','even2'], scale:1});\n  }\n\n  stageTheme(){\n    // per-stage ambience \u2014 only background tones change; gameplay-signal colors\n    // (amber cages/lights, pink enemies, red doors, green exit) stay constant.\n    const themes=[\n      {name:'NIGHT',     bgTop:'#16131f', bgBot:'#0b0912', wall:'#1d1a2c', floor:'#221f33', edge:'#2c2942', edgeHi:'#403c66', floorTop:'#262338', shaft:'#0e0c17', label:'rgba(140,138,166,.35)'},\n      {name:'DUSK',      bgTop:'#2a1420', bgBot:'#120a10', wall:'#2e1a24', floor:'#331e28', edge:'#432732', edgeHi:'#6e404c', floorTop:'#39232d', shaft:'#160b11', label:'rgba(196,152,150,.38)'},\n      {name:'DEEP SEA',  bgTop:'#0b1f26', bgBot:'#05111a', wall:'#13262e', floor:'#1a2e34', edge:'#23404a', edgeHi:'#3d6d6d', floorTop:'#1e333a', shaft:'#07141a', label:'rgba(140,178,184,.38)'},\n      {name:'BIOHAZARD', bgTop:'#141f10', bgBot:'#0a1207', wall:'#1c281a', floor:'#24331e', edge:'#354226', edgeHi:'#5a6d3d', floorTop:'#2a3821', shaft:'#0a120a', label:'rgba(168,182,138,.38)'},\n      {name:'REACTOR',   bgTop:'#250f12', bgBot:'#12060a', wall:'#2b1620', floor:'#341a20', edge:'#43262c', edgeHi:'#6e3d44', floorTop:'#39202a', shaft:'#150709', label:'rgba(196,150,155,.38)'}\n    ];\n    return themes[(Math.max(1,this.stage||1)-1) % themes.length];\n  }\n\n  draw(){\n    const c=this.ctx; if(!c) return;\n    const W=this.W,H=this.H,FH=this.FLOOR_H,WALL=this.WALL,CAGEH=this.CAGEH;\n    this.frame++;\n    const th=this.stageTheme();\n    const bg=c.createLinearGradient(0,0,0,H);\n    bg.addColorStop(0,th.bgTop); bg.addColorStop(1,th.bgBot);\n    c.fillStyle=bg; c.fillRect(0,0,W,H);\n\n    if(this.world){\n      const {num,shafts,doors,lights,enemies,exit}=this.world, p=this.player;\n      c.save(); c.translate(0,-this.camY);\n      const worldH=num*FH;\n      // walls\n      c.fillStyle=th.wall; c.fillRect(0,0,WALL,worldH); c.fillRect(W-WALL,0,WALL,worldH);\n      // floors\n      for(let f=0;f<num;f++){\n        const t=f*FH;\n        c.fillStyle=th.floor; c.fillRect(WALL,t,W-2*WALL,FH);\n        c.fillStyle=th.edge; c.fillRect(WALL,t+FH-16,W-2*WALL,16);\n        c.fillStyle=th.edgeHi; c.fillRect(WALL,t+FH-16,W-2*WALL,3);\n        c.fillStyle=th.floorTop; c.fillRect(WALL,t,W-2*WALL,6);\n        c.fillStyle=th.label; c.font=\"11px 'Space Mono',monospace\"; c.textAlign='left';\n        c.fillText((num-f<10?'0':'')+(num-f)+'F', WALL+8, t+FH-24);\n      }\n      // light pools\n      c.save(); c.globalCompositeOperation='lighter';\n      for(const l of lights){\n        if(!l.on) continue;\n        const lv=l.lvl==null?1:l.lvl;\n        if(lv<=0.02) continue;\n        const t=l.floor*FH, lx=l.x, ly=t+24;\n        const g=c.createRadialGradient(lx,ly,8,lx,ly+46,FH*1.2);\n        g.addColorStop(0,'rgba(255,240,205,'+(0.30*lv).toFixed(3)+')');\n        g.addColorStop(.5,'rgba(255,225,170,'+(0.11*lv).toFixed(3)+')');\n        g.addColorStop(1,'rgba(255,225,170,0)');\n        c.fillStyle=g; c.fillRect(WALL,t,W-2*WALL,FH);\n      }\n      c.restore();\n      for(const l of lights){\n        const t=l.floor*FH, lv=l.on?(l.lvl==null?1:l.lvl):0;\n        if(lv>0.02){\n          const mix=Math.min(1,lv);\n          c.globalAlpha=0.35+0.65*mix;\n          c.fillStyle='#ffe7a0'; c.fillRect(l.x-14,t+8,28,7);\n          c.globalAlpha=1;\n          c.fillStyle='rgba(255,231,160,'+(0.5*mix).toFixed(3)+')'; c.fillRect(l.x-10,t+15,20,3);\n        } else {\n          c.fillStyle='#3a3550'; c.fillRect(l.x-14,t+8,28,7);\n        }\n      }\n      // shafts (open hazard shafts) + auto-cycling cages\n      for(const s of shafts){\n        const y0=s.top*FH, y1=(s.bot)*FH+FH, roofY=s.carY-CAGEH;\n        c.fillStyle='#0e0c17'; c.fillRect(s.x-30,y0,60,y1-y0);\n        c.fillStyle='#2a2742'; c.fillRect(s.x-30,y0,3,y1-y0); c.fillRect(s.x+27,y0,3,y1-y0);\n        c.strokeStyle='rgba(74,70,104,.4)'; c.lineWidth=1;\n        c.beginPath(); c.moveTo(s.x-9,y0); c.lineTo(s.x-9,y1); c.moveTo(s.x+9,y0); c.lineTo(s.x+9,y1); c.stroke();\n        // crush ceiling at the very top of the shaft\n        c.fillStyle='#241726'; c.fillRect(s.x-30,s.ceilY-8,60,10);\n        for(let i=0;i<6;i++){ c.fillStyle=i%2?'#7a2436':'#2a2742'; c.fillRect(s.x-30+i*10,s.ceilY,10,3); }\n        // caution lips marking the open floor edges\n        for(let f=s.top; f<=s.bot; f++){ const ly=f*FH+FH-16;\n          c.fillStyle='#e0a92a'; c.fillRect(s.x-34,ly,4,11); c.fillRect(s.x+30,ly,4,11); }\n        // cables\n        c.strokeStyle='rgba(120,116,150,.4)'; c.lineWidth=2; c.beginPath(); c.moveTo(s.x-8,y0); c.lineTo(s.x-8,roofY); c.moveTo(s.x+8,y0); c.lineTo(s.x+8,roofY); c.stroke();\n        // cage body (roof -> interior floor); open interior you can ride inside\n        c.fillStyle='rgba(120,90,30,.16)'; c.fillRect(s.x-26,roofY,52,CAGEH);\n        c.fillStyle='rgba(255,210,90,.10)'; c.fillRect(s.x-22,roofY+6,44,CAGEH-12);\n        c.fillStyle='rgba(255,194,61,.22)'; c.fillRect(s.x-26,roofY,4,CAGEH); c.fillRect(s.x+22,roofY,4,CAGEH);\n        c.strokeStyle='rgba(255,194,61,.30)'; c.lineWidth=1.5; c.strokeRect(s.x-26,roofY,52,CAGEH);\n        // interior floor (bottom \u2014 ride inside, safe)\n        c.fillStyle='#9c7a1e'; c.fillRect(s.x-25,s.carY-5,50,7);\n        c.fillStyle='#caa028'; c.fillRect(s.x-25,s.carY-5,50,2);\n        // roof (top \u2014 ride on top, crushable)\n        c.fillStyle='#caa028'; c.fillRect(s.x-27,roofY-5,54,8);\n        c.fillStyle='#ffd24a'; c.fillRect(s.x-27,roofY-5,54,3);\n      }\n      // doors\n      for(const d of doors){\n        const fy=this.feetY(d.floor), dx=d.x;\n        if(d.got){\n          c.strokeStyle='#5a3a48'; c.lineWidth=2; c.strokeRect(dx-19,fy-65,38,65);\n          c.fillStyle='rgba(90,58,72,.25)'; c.fillRect(dx-17,fy-63,34,63);\n        } else {\n          c.fillStyle='rgba(255,90,110,.22)'; c.fillRect(dx-26,fy-72,52,72);\n          c.fillStyle='#ff5a6e'; this.rr(c,dx-19,fy-65,38,65,3); c.fill();\n          c.fillStyle='#d83b50'; c.fillRect(dx-19,fy-65,38,4);\n          c.fillStyle='#fff'; c.fillRect(dx-9,fy-44,18,22);\n          c.fillStyle='#ff5a6e'; c.fillRect(dx-6,fy-40,12,2); c.fillRect(dx-6,fy-35,12,2); c.fillRect(dx-6,fy-30,8,2);\n          c.fillStyle='#2c2942'; c.beginPath(); c.arc(dx+13,fy-33,2.5,0,7); c.fill();\n        }\n      }\n      // exit\n      const ex=exit.x, ey=this.feetY(exit.floor);\n      if(exit.active){\n        c.fillStyle='rgba(77,255,158,.25)'; c.fillRect(ex-30,ey-74,60,74);\n        c.fillStyle='#1c3a2c'; this.rr(c,ex-22,ey-66,44,66,3); c.fill();\n        c.fillStyle='#4dff9e'; c.font=\"bold 13px 'Space Mono',monospace\"; c.textAlign='center';\n        c.fillText('EXIT',ex,ey-44);\n        c.fillStyle='#4dff9e'; const a=(this.frame*0.1)%6;\n        for(let i=0;i<3;i++){ c.globalAlpha=0.4+0.5*Math.max(0,Math.sin(a-i*0.7)); c.fillText('\u25be',ex,ey-26+i*8); }\n        c.globalAlpha=1;\n      } else {\n        c.strokeStyle='#3a4a44'; c.lineWidth=2; c.strokeRect(ex-22,ey-66,44,66);\n        c.fillStyle='rgba(40,55,48,.3)'; c.fillRect(ex-20,ey-64,40,64);\n        c.fillStyle='#4a5a54'; c.font=\"10px 'Space Mono',monospace\"; c.textAlign='center'; c.fillText('LOCKED',ex,ey-30);\n      }\n      // enemies\n      const esk=this.enemySkin();\n      const ok=(im)=>im&&im.complete&&im.naturalWidth>0;\n      const eframes=(esk.frames||[]).map(k=>this.sprites[k]).filter(ok);\n      const useSpr=eframes.length>0;\n      // scale so the sprite lands at drawH px tall (art may be 96px), else explicit scale\n      const espScale = (esk.drawH && useSpr) ? esk.drawH/eframes[0].naturalHeight : (esk.scale||1);\n      for(const e of enemies){\n        const efy=this.feetY(e.floor);\n        if(e.dead){\n          if(e.fade>0){ c.globalAlpha=e.fade;\n            if(useSpr) this.drawSpriteAgent(c,e.px,efy,eframes[0],espScale,{}); else this.drawAgent(c,e.px,efy,e.dir,esk.dead,{skin:esk});\n            c.globalAlpha=1; }\n          continue;\n        }\n        if(useSpr){\n          // walk cycle \u2014 step through the frame list on the walk phase\n          const idx=Math.floor(((e.wphase||0)/Math.PI)%eframes.length+eframes.length)%eframes.length;\n          this.drawSpriteAgent(c,e.px,efy,eframes[idx],espScale,{alert:e.alert});\n        }\n        else this.drawAgent(c,e.px,efy,e.dir,esk.col,{alert:e.alert, walk:e.wphase, skin:esk});\n      }\n      // on failing-light stages the whole room dims \u2014 walls, cages, doors and enemies alike\n      if(this.lightsAnimated()){\n        for(const l of lights){\n          const lv=l.on?(l.lvl==null?1:this.clamp(l.lvl,0,1)):0;\n          const dim=(1-lv)*0.66;\n          if(dim<=0.01) continue;\n          c.fillStyle='rgba(4,3,10,'+dim.toFixed(3)+')';\n          c.fillRect(0,l.floor*FH,W,FH);\n        }\n      }\n      // bullets (enemy: amber = high/duck, orange = low/jump)\n      for(const b of this.bullets){\n        c.fillStyle = b.owner==='p' ? '#9cf04d' : (b.hi ? '#ffd23f' : '#ff6a3d');\n        c.shadowColor=c.fillStyle; c.shadowBlur=8;\n        c.fillRect(b.x-(b.vx>0?12:0), b.y-2, 12, 4);\n        c.shadowBlur=0;\n      }\n      // particles\n      for(const pt of this.particles){\n        const al=Math.max(0,pt.life);\n        if(pt.ring){ c.globalAlpha=al*0.85; c.strokeStyle=pt.color; c.lineWidth=Math.max(1,3.5*al); c.beginPath(); c.arc(pt.x,pt.y,pt.r,0,7); c.stroke(); }\n        else if(pt.flash){ c.globalAlpha=1; const fg=c.createRadialGradient(pt.x,pt.y,0,pt.x,pt.y,pt.r); fg.addColorStop(0,'rgba(255,255,255,'+(al*0.9)+')'); fg.addColorStop(0.4,'rgba(255,238,196,'+(al*0.5)+')'); fg.addColorStop(1,'rgba(255,214,150,0)'); c.fillStyle=fg; c.beginPath(); c.arc(pt.x,pt.y,pt.r,0,7); c.fill(); }\n        else { const s=pt.size!=null?pt.size:2; c.globalAlpha=al; if(pt.glow){ c.shadowColor=pt.color; c.shadowBlur=8; } c.fillStyle=pt.color; c.fillRect(pt.x-s,pt.y-s,s*2,s*2); if(pt.glow) c.shadowBlur=0; }\n      }\n      c.globalAlpha=1;\n      // player\n      const pcol=this.props.playerColor||'#34e3ff';\n      if(!p.exploded){\n        // invulnerability shield \u2014 always visible so the safe window is unmistakable\n        if(p.invuln>0){\n          const cy=(p.air&&p.vy>1.0)?p.py-20:p.py-22;\n          c.save();\n          c.globalAlpha=0.45+0.3*Math.sin(this.frame*0.4);\n          c.strokeStyle=pcol; c.lineWidth=2.5; c.shadowColor=pcol; c.shadowBlur=12;\n          c.beginPath(); c.ellipse(p.px,cy,23,31,0,0,7); c.stroke();\n          c.globalAlpha=(0.14+0.1*Math.sin(this.frame*0.4));\n          c.fillStyle=pcol; c.beginPath(); c.ellipse(p.px,cy,21,29,0,0,7); c.fill();\n          c.restore();\n        }\n        // during i-frames flicker translucently (stays visible) instead of vanishing\n        c.save();\n        c.globalAlpha = p.invuln>0 ? (this.frame%8<4 ? 0.45 : 0.9) : 1;\n        if(p.air && p.vy>1.0){\n          c.translate(p.px, p.py-20); c.rotate((this.frame*0.32)%6.2832);\n          this.drawAgent(c,0,20,p.dir,pcol,{});\n        } else {\n          this.drawAgent(c,p.px,p.py,p.dir,pcol,{crouch:p.crouch, walk:p.wphase});\n        }\n        c.restore();\n      }\n      c.restore();\n    }\n\n    // vignette\n    const v=c.createRadialGradient(W/2,H/2,H*0.35,W/2,H/2,H*0.85);\n    v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,0,0,.55)');\n    c.fillStyle=v; c.fillRect(0,0,W,H);\n    // scanlines\n    if(this.props.scanlines!==false){\n      c.fillStyle='rgba(0,0,0,.10)';\n      for(let y=0;y<H;y+=3) c.fillRect(0,y,W,1);\n    }\n  }\n\n  loop(t){\n    if(!this.running) return;\n    const dt=Math.min(50, t-this.last); this.last=t;\n    this.pollGamepad();\n    if(this.state.mode==='playing') this.update(dt);\n    this.draw();\n    this.scheduleBGM();\n    requestAnimationFrame(this.loop);\n  }\n\n  renderVals(){\n    const s=this.state;\n    return {\n      canvasRef:this.canvasRef,\n      showTitle: s.mode==='title',\n      showHud: s.mode!=='title',\n      showCleared: s.mode==='cleared',\n      showGameOver: s.mode==='gameover',\n      stage:s.stage,\n      docsText: s.docs+' / '+s.totalDocs,\n      lives:s.lives,\n      timeText:s.timeText,\n      score:String(s.score).padStart(6,'0'),\n      bonusText:s.bonusText,\n      start:()=>this.startGame(),\n      continueStage:()=>this.continueStage(),\n      restart:()=>this.startGame()\n    };\n  }\n}\n<\/script>\n\n\n<\/body><\/html>"
  </script>
